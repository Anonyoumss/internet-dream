name: macOS DMG

on:
  push:
    branches: [main]
    paths: ["desktop-mac/**", "scripts/**", ".github/workflows/macos.yml"]
  workflow_dispatch:

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Build app + DMG
        run: bash scripts/build-mac-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: internet-dream-macos-dmg
          path: build-mac/*.dmg
          retention-days: 30
