name: Browser extension

on:
  push:
    branches: [main]
    paths: ["extension/**", "scripts/package-extension.sh", ".github/workflows/extension.yml"]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check extension JS
        run: |
          node --check extension/background.js
          node --check extension/popup.js
          node --check extension/content.js
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json'))"
      - name: Validate manifest icons exist
        run: |
          for f in $(node -e "const m=require('./extension/manifest.json');console.log(Object.values(m.icons).join(' '))"); do
            test -f "extension/$f" || { echo "missing icon: $f"; exit 1; }
          done
      - name: Package zip
        run: bash scripts/package-extension.sh
      - uses: actions/upload-artifact@v4
        with:
          name: internet-dream-extension-zip
          path: dist/internet-dream-extension.zip
          retention-days: 30
