<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --primary: #6750a4; --on-primary: #fff;
    --surface: #fef7ff; --on-surface: #1d1b20;
    --surface-high: #ece6f0; --outline: #cac4d0;
    --secondary-container: #e8def8; --on-secondary-container: #1d192b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #d0bcff; --on-primary: #381e72;
      --surface: #141218; --on-surface: #e6e0e9;
      --surface-high: #36343b; --outline: #49454f;
      --secondary-container: #4a4458; --on-secondary-container: #e8def8;
    }
  }
  * { box-sizing: border-box; }
  body {
    width: 320px; margin: 0; padding: 16px;
    font: 14px/1.45 "Segoe UI", system-ui, sans-serif;
    background: var(--surface); color: var(--on-surface);
  }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .sub { font-size: 12px; color: var(--outline); margin: 0 0 14px; }
  .status { font-size: 12px; padding: 6px 10px; border-radius: 999px; display: inline-block; margin-bottom: 12px;
    background: var(--secondary-container); color: var(--on-secondary-container); }
  .status.off { background: var(--surface-high); color: var(--on-surface); }
  button {
    width: 100%; padding: 10px; margin-top: 8px; border: none; border-radius: 999px;
    font-weight: 600; cursor: pointer; font-size: 13px;
    background: var(--primary); color: var(--on-primary);
  }
  button.secondary { background: var(--surface-high); color: var(--on-surface); }
  button:disabled { opacity: .5; }
  input {
    width: 100%; padding: 8px 10px; margin-top: 6px; font: inherit; font-size: 13px;
    border: 1px solid var(--outline); border-radius: 10px;
    background: var(--surface); color: var(--on-surface);
  }
  details { margin-top: 12px; }
  summary { font-size: 12px; cursor: pointer; color: var(--outline); }
  #msg { font-size: 12px; margin-top: 10px; min-height: 16px; }
  #msg.ok { color: #2e7d32; } #msg.err { color: #c62828; }
</style>
</head>
<body>
  <h1>Internet's Dream</h1>
  <p class="sub">Save this page, a selection, or search your memory.</p>
  <span id="status" class="status off">checking…</span>

  <button id="save-page">Save this page</button>
  <button id="save-page-note" class="secondary">Save page + note</button>
  <button id="save-selection" class="secondary">Save selection</button>

  <details>
    <summary>Search memory</summary>
    <input id="search-q" placeholder="e.g. restaurant recommendation…">
    <div id="results" style="margin-top:8px;font-size:12px;max-height:180px;overflow:auto"></div>
  </details>

  <details>
    <summary>Connection</summary>
    <input id="api-base" placeholder="http://127.0.0.1:8765">
    <button id="save-api" class="secondary">Save</button>
  </details>

  <div id="msg"></div>
  <script src="popup.js"></script>
</body>
</html>
