[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dreamcore"
version = "0.1.0"
description = "Universal Contextual Memory — private, locally-encrypted personal second brain"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8"]
google = [
    "google-api-python-client>=2.100",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.2",
]
telegram = ["telethon>=1.36"]
android-export = []

[project.scripts]
dream = "dreamcore.cli:main"

[tool.setuptools.packages.find]
include = ["dreamcore*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
